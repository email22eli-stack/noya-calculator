<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="נויה">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="Noya.png">
<title>מחשבון נויה — בגרות 5 יחידות</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ══ Reset ══════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: #060612;
  color: #e0e0ff;
  font-family: 'Segoe UI', Arial, sans-serif;
  touch-action: manipulation;
  user-select: none;
}

/* ══ Starfield background ════════════════════════════════ */
#stars {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 50%, rgba(124,58,237,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 20%, rgba(0,212,212,0.10) 0%, transparent 40%),
    radial-gradient(ellipse at 60% 80%, rgba(168,85,247,0.10) 0%, transparent 40%),
    #060612;
  overflow: hidden;
}
.star {
  position: absolute;
  border-radius: 50%;
  background: white;
  animation: twinkle linear infinite;
}
@keyframes twinkle {
  0%,100% { opacity: 0.1; transform: scale(1); }
  50%      { opacity: 0.9; transform: scale(1.4); }
}
.math-float {
  position: absolute;
  color: rgba(124,58,237,0.18);
  font-family: 'Orbitron', monospace;
  animation: floatUp linear infinite;
  pointer-events: none;
}
@keyframes floatUp {
  from { transform: translateY(105vh) rotate(0deg); opacity: 0; }
  5%   { opacity: 1; }
  95%  { opacity: 0.6; }
  to   { transform: translateY(-5vh) rotate(360deg); opacity: 0; }
}

/* ══ Splash ══════════════════════════════════════════════ */
#splash {
  position: fixed; inset: 0; z-index: 1000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  cursor: pointer;
  transition: opacity 0.7s ease;
}
#splash.hide { opacity: 0; pointer-events: none; }
.splash-glow {
  position: absolute; width: 320px; height: 320px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(124,58,237,0.3) 0%, transparent 70%);
  animation: splashPulse 3s ease-in-out infinite;
}
@keyframes splashPulse {
  0%,100% { transform: scale(1); opacity: 0.6; }
  50%     { transform: scale(1.2); opacity: 1; }
}
#splashImg {
  width: min(180px, 44vw);
  border-radius: 50%;
  border: 2px solid rgba(0,212,212,0.5);
  box-shadow:
    0 0 0 6px rgba(124,58,237,0.2),
    0 0 40px rgba(124,58,237,0.7),
    0 0 80px rgba(0,212,212,0.3);
  animation: imgPulse 3s ease-in-out infinite;
  position: relative; z-index: 1;
}
@keyframes imgPulse {
  0%,100% { box-shadow: 0 0 0 6px rgba(124,58,237,0.2), 0 0 40px rgba(124,58,237,0.7), 0 0 80px rgba(0,212,212,0.3); }
  50%     { box-shadow: 0 0 0 10px rgba(124,58,237,0.3), 0 0 60px rgba(124,58,237,1),   0 0 120px rgba(0,212,212,0.5); }
}
#splash h1 {
  font-family: 'Orbitron', monospace;
  font-size: clamp(2rem, 7vw, 3.2rem);
  font-weight: 900;
  background: linear-gradient(135deg, #00d4d4 0%, #a855f7 50%, #7c3aed 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-top: 20px; letter-spacing: 3px;
  text-shadow: none;
}
#splash p {
  color: rgba(200,200,255,0.55);
  font-size: clamp(0.8rem, 2.5vw, 0.95rem);
  margin-top: 8px; letter-spacing: 1px;
}
.tap-hint {
  position: absolute; bottom: 36px;
  font-size: 0.78rem; color: rgba(255,255,255,0.28);
  animation: blinkHint 2.5s ease-in-out infinite;
  letter-spacing: 1px;
}
@keyframes blinkHint { 0%,100%{opacity:0.2} 50%{opacity:0.7} }
.splash-ring {
  position: absolute; border-radius: 50%;
  border: 1px solid rgba(124,58,237,0.25);
  animation: ringExpand 4s ease-out infinite;
}
@keyframes ringExpand {
  0%   { width: 220px; height: 220px; opacity: 0.6; }
  100% { width: 500px; height: 500px; opacity: 0; }
}

/* ══ Main app ════════════════════════════════════════════ */
#app {
  position: fixed; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* ══ Display ═════════════════════════════════════════════ */
.display-wrap {
  position: relative;
  background: linear-gradient(160deg, rgba(30,27,75,0.85) 0%, rgba(13,13,26,0.9) 100%);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(0,212,212,0.2);
  padding: 14px 18px 10px;
  flex-shrink: 0;
  box-shadow: 0 4px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
}
.display-wrap::after {
  content: '';
  position: absolute; bottom: 0; left: 10%; right: 10%; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(0,212,212,0.4), transparent);
}
.display-expr {
  font-size: clamp(0.7rem, 2vw, 0.85rem);
  color: rgba(168,85,247,0.7);
  min-height: 1.1em;
  text-align: left;
  font-family: 'Orbitron', monospace;
  letter-spacing: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.display-main {
  font-family: 'Orbitron', monospace;
  font-size: clamp(2rem, 9vw, 3.2rem);
  font-weight: 700;
  text-align: left;
  background: linear-gradient(135deg, #ffffff 0%, #c0d0ff 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  line-height: 1.1; padding-top: 2px;
}
.display-main.error {
  background: none; -webkit-text-fill-color: #f38ba8;
  font-size: clamp(0.9rem,3.5vw,1.3rem);
}

/* ══ Button grid ══════════════════════════════════════════ */
.btn-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  padding: 8px;
  flex: 1;
  overflow: hidden;
}

.btn {
  position: relative;
  border: none; border-radius: 12px;
  font-size: clamp(0.85rem, 3vw, 1.2rem);
  font-weight: 700;
  cursor: pointer;
  transition: transform 0.08s, box-shadow 0.08s;
  min-height: 46px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  letter-spacing: 0.5px;
  overflow: hidden;
}
.btn::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
  border-radius: inherit;
  pointer-events: none;
}
.btn:active {
  transform: scale(0.91);
  box-shadow: 0 0 20px currentColor !important;
}

/* color variants */
.btn-num {
  background: rgba(30,27,75,0.8);
  border: 1px solid rgba(100,80,200,0.25);
  color: #e0e0ff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.btn-num:hover { border-color: rgba(124,58,237,0.4); }

.btn-op {
  background: linear-gradient(135deg, rgba(124,58,237,0.85), rgba(109,40,217,0.85));
  border: 1px solid rgba(167,139,250,0.3);
  color: #fff;
  box-shadow: 0 2px 12px rgba(124,58,237,0.3);
}

.btn-eq {
  background: linear-gradient(135deg, #00d4d4, #0891b2);
  border: 1px solid rgba(0,212,212,0.4);
  color: #050510;
  box-shadow: 0 2px 16px rgba(0,212,212,0.35);
}

.btn-clear {
  background: linear-gradient(135deg, rgba(220,38,38,0.85), rgba(185,28,28,0.85));
  border: 1px solid rgba(248,113,113,0.3);
  color: #fff;
  box-shadow: 0 2px 12px rgba(220,38,38,0.3);
}

.btn-del {
  background: linear-gradient(135deg, rgba(159,18,57,0.85), rgba(136,19,55,0.85));
  border: 1px solid rgba(251,113,133,0.3);
  color: #fff;
  box-shadow: 0 2px 8px rgba(159,18,57,0.3);
}

.btn-quad {
  background: linear-gradient(135deg, rgba(217,119,6,0.9), rgba(180,83,9,0.9));
  border: 1px solid rgba(251,191,36,0.3);
  color: #fff;
  font-size: clamp(0.75rem, 2.2vw, 1rem);
  box-shadow: 0 2px 12px rgba(217,119,6,0.3);
}

.btn-form {
  background: linear-gradient(135deg, rgba(168,85,247,0.9), rgba(124,58,237,0.9));
  border: 1px solid rgba(216,180,254,0.3);
  color: #fff;
  font-size: clamp(0.68rem, 2vw, 0.9rem);
  box-shadow: 0 2px 12px rgba(168,85,247,0.3);
}

.btn-func {
  background: linear-gradient(135deg, rgba(8,145,178,0.9), rgba(14,116,144,0.9));
  border: 1px solid rgba(103,232,249,0.3);
  color: #fff;
  font-size: clamp(0.68rem, 2vw, 0.9rem);
  box-shadow: 0 2px 12px rgba(8,145,178,0.3);
}

.btn-wide { grid-column: span 2; }

/* ══ Panels ══════════════════════════════════════════════ */
.panel {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(6,6,18,0.95);
  backdrop-filter: blur(24px);
  display: none; flex-direction: column;
  overflow: hidden;
}
.panel.open { display: flex; }

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  background: linear-gradient(135deg, rgba(30,27,75,0.9), rgba(13,13,26,0.9));
  border-bottom: 1px solid rgba(124,58,237,0.35);
  flex-shrink: 0;
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
}
.panel-title {
  font-family: 'Orbitron', monospace;
  font-size: clamp(0.9rem, 3vw, 1.2rem);
  font-weight: 700;
  background: linear-gradient(135deg, #00d4d4, #a855f7);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.btn-close {
  background: rgba(220,38,38,0.15);
  border: 1px solid rgba(220,38,38,0.35);
  color: #f38ba8; border-radius: 8px;
  width: 34px; height: 34px; font-size: 1.1rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.btn-close:hover { background: rgba(220,38,38,0.3); }

/* ── Formula panel ── */
.formula-tabs {
  display: flex; overflow-x: auto; gap: 6px;
  padding: 10px 12px; flex-shrink: 0;
  scrollbar-width: none;
}
.formula-tabs::-webkit-scrollbar { display: none; }
.tab-btn {
  background: rgba(30,27,75,0.5);
  border: 1px solid rgba(124,58,237,0.25);
  color: rgba(200,200,255,0.65); border-radius: 20px;
  padding: 6px 14px; white-space: nowrap; cursor: pointer;
  font-size: clamp(0.68rem, 2vw, 0.82rem);
  transition: all 0.2s;
}
.tab-btn.active {
  background: linear-gradient(135deg, #7c3aed, #a855f7);
  color: #fff; border-color: #a855f7;
  box-shadow: 0 0 12px rgba(168,85,247,0.4);
}
.search-wrap { padding: 0 12px 8px; flex-shrink: 0; }
.search-input {
  width: 100%;
  background: rgba(30,27,75,0.5);
  border: 1px solid rgba(124,58,237,0.3);
  color: #e0e0ff; border-radius: 10px;
  padding: 9px 14px; font-size: 0.92rem;
  outline: none; transition: border-color 0.2s;
}
.search-input:focus { border-color: #7c3aed; box-shadow: 0 0 0 2px rgba(124,58,237,0.2); }
.search-input::placeholder { color: rgba(200,200,255,0.3); }

.formula-list {
  flex: 1; overflow-y: auto; padding: 0 12px 12px;
  scrollbar-width: thin; scrollbar-color: rgba(124,58,237,0.4) transparent;
}
.formula-card {
  background: rgba(30,27,75,0.4);
  border: 1px solid rgba(124,58,237,0.18);
  border-radius: 12px; padding: 11px 14px;
  margin-bottom: 7px; cursor: pointer;
  transition: all 0.18s;
  backdrop-filter: blur(8px);
}
.formula-card:hover, .formula-card:active {
  border-color: rgba(168,85,247,0.5);
  background: rgba(168,85,247,0.12);
  box-shadow: 0 0 16px rgba(168,85,247,0.15);
}
.formula-tag {
  font-size: 0.68rem; color: #a855f7;
  letter-spacing: 0.5px; margin-bottom: 4px; text-transform: uppercase;
}
.formula-text {
  font-family: 'Courier New', monospace;
  font-size: clamp(0.82rem, 2.4vw, 0.97rem);
  color: #c0d0ff; direction: ltr; text-align: left;
}

/* ── Quadratic panel ── */
.quad-body {
  flex: 1; overflow-y: auto; padding: 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.quad-eq-title {
  text-align: center;
  font-family: 'Orbitron', monospace;
  color: rgba(200,200,255,0.5);
  font-size: 0.95rem; letter-spacing: 1px;
}
.input-row {
  display: flex; gap: 12px; align-items: center;
}
.coef-label {
  color: #a855f7; font-weight: 700; font-size: 1rem;
  white-space: nowrap; width: 40px; text-align: left;
  font-family: 'Orbitron', monospace;
}
.coef-input {
  flex: 1;
  background: rgba(30,27,75,0.6);
  border: 1px solid rgba(124,58,237,0.35);
  color: #e0e0ff; border-radius: 10px;
  padding: 11px 14px; font-size: 1.1rem;
  outline: none; text-align: center;
  font-family: 'Orbitron', monospace;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.coef-input:focus {
  border-color: #7c3aed;
  box-shadow: 0 0 0 2px rgba(124,58,237,0.2);
}
.solve-btn {
  background: linear-gradient(135deg, #d97706, #b45309);
  color: #fff; border: none; border-radius: 12px;
  padding: 14px; font-size: 1.05rem; font-weight: 700;
  cursor: pointer; width: 100%; letter-spacing: 1px;
  box-shadow: 0 4px 16px rgba(217,119,6,0.3);
  transition: transform 0.1s, box-shadow 0.1s;
}
.solve-btn:active { transform: scale(0.97); }

.quad-result {
  background: rgba(30,27,75,0.5);
  border: 1px solid rgba(0,212,212,0.25);
  border-radius: 14px; padding: 16px;
  font-family: 'Courier New', monospace;
  font-size: clamp(0.88rem, 2.5vw, 1rem);
  line-height: 1.9;
  white-space: pre-wrap;
  backdrop-filter: blur(8px);
  display: none;
}
.quad-result.show { display: block; }
.res-green  { color: #a6e3a1; }
.res-blue   { color: #89b4fa; }
.res-orange { color: #fab387; }
.res-red    { color: #f38ba8; }
.res-purple { color: #cba6f7; }

/* ── Function analysis panel ── */
.func-body {
  flex: 1; overflow-y: auto; padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.func-input-row {
  display: flex; gap: 8px; align-items: center;
}
.func-label {
  color: #89b4fa; font-weight: 700;
  font-size: 1rem; white-space: nowrap;
  font-family: 'Orbitron', monospace;
}
.func-input {
  flex: 1;
  background: rgba(30,27,75,0.6);
  border: 1px solid rgba(137,180,250,0.35);
  color: #e0e0ff; border-radius: 10px;
  padding: 10px 14px; font-size: 0.97rem;
  outline: none; direction: ltr;
  font-family: 'Courier New', monospace;
  transition: border-color 0.2s;
}
.func-input:focus { border-color: #89b4fa; box-shadow: 0 0 0 2px rgba(137,180,250,0.15); }
.analyze-btn {
  background: linear-gradient(135deg, #0891b2, #0e7490);
  color: #fff; border: none; border-radius: 10px;
  padding: 10px 16px; font-size: 0.95rem; font-weight: 700;
  cursor: pointer; white-space: nowrap;
  box-shadow: 0 2px 12px rgba(8,145,178,0.3);
}
.func-examples {
  color: rgba(200,200,255,0.35); font-size: 0.72rem;
  text-align: center; direction: ltr;
}
.spinner {
  display: none; text-align: center; padding: 24px;
  color: #7c3aed; font-size: 2rem;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner.show { display: block; }

.func-result {
  background: rgba(20,18,50,0.7);
  border: 1px solid rgba(137,180,250,0.2);
  border-radius: 14px; padding: 14px 16px;
  font-family: 'Courier New', monospace;
  font-size: clamp(0.76rem, 2vw, 0.9rem);
  line-height: 2;
  white-space: pre-wrap;
  direction: ltr; text-align: left;
  display: none; overflow-x: auto;
  backdrop-filter: blur(8px);
}
.func-result.show { display: block; }
.fr-title   { color: #cba6f7; font-weight: bold; }
.fr-section { color: #89b4fa; font-weight: bold; }
.fr-value   { color: #a6e3a1; }
.fr-warn    { color: #fab387; }
.fr-dim     { color: #6c7086; }

#plotDiv {
  border-radius: 14px; overflow: hidden;
  border: 1px solid rgba(137,180,250,0.15);
  display: none; min-height: 260px;
  background: #080d18;
  box-shadow: 0 4px 20px rgba(0,0,0,0.5);
}
#plotDiv.show { display: block; }

/* ── Toast ── */
.copy-toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, #00d4d4, #0891b2);
  color: #050510; padding: 10px 26px; border-radius: 20px;
  font-weight: 700; font-size: 0.88rem; z-index: 9999;
  opacity: 0; transition: opacity 0.25s; pointer-events: none;
  box-shadow: 0 4px 20px rgba(0,212,212,0.4);
}
.copy-toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- Starfield -->
<div id="stars"></div>

<!-- Splash -->
<div id="splash" onclick="dismissSplash()">
  <div class="splash-ring" style="animation-delay:0s"></div>
  <div class="splash-ring" style="animation-delay:1.3s"></div>
  <div class="splash-ring" style="animation-delay:2.6s"></div>
  <div class="splash-glow"></div>
  <img id="splashImg" src="Noya.png" alt="נויה">
  <h1>נויה</h1>
  <p>מחשבון בגרות מתמטיקה 5 יחידות</p>
  <div class="tap-hint">לחץ להמשך ✦</div>
</div>

<!-- App -->
<div id="app">
  <div class="display-wrap">
    <div class="display-expr" id="exprDisplay"></div>
    <div class="display-main" id="mainDisplay">0</div>
  </div>
  <div class="btn-grid">
    <button class="btn btn-form" onclick="openPanel('formulaPanel')">נוסחאות</button>
    <button class="btn btn-quad" onclick="openPanel('quadPanel')">x²</button>
    <button class="btn btn-func" onclick="openPanel('funcPanel')">חקר f(x)</button>
    <button class="btn btn-del"  onclick="delChar()">⌫</button>

    <button class="btn btn-clear" onclick="clearAll()">C</button>
    <button class="btn btn-op"   onclick="inputOp('%')">%</button>
    <button class="btn btn-op"   onclick="toggleSign()">+/−</button>
    <button class="btn btn-op"   onclick="inputOp('/')">÷</button>

    <button class="btn btn-num" onclick="inputDigit('7')">7</button>
    <button class="btn btn-num" onclick="inputDigit('8')">8</button>
    <button class="btn btn-num" onclick="inputDigit('9')">9</button>
    <button class="btn btn-op"  onclick="inputOp('*')">×</button>

    <button class="btn btn-num" onclick="inputDigit('4')">4</button>
    <button class="btn btn-num" onclick="inputDigit('5')">5</button>
    <button class="btn btn-num" onclick="inputDigit('6')">6</button>
    <button class="btn btn-op"  onclick="inputOp('-')">−</button>

    <button class="btn btn-num" onclick="inputDigit('1')">1</button>
    <button class="btn btn-num" onclick="inputDigit('2')">2</button>
    <button class="btn btn-num" onclick="inputDigit('3')">3</button>
    <button class="btn btn-op"  onclick="inputOp('+')">+</button>

    <button class="btn btn-num btn-wide" onclick="inputDigit('0')">0</button>
    <button class="btn btn-num" onclick="inputDot()">.</button>
    <button class="btn btn-eq"  onclick="calculate()">=</button>
  </div>
</div>

<!-- ══ Formula Panel ══════════════════════════════════════ -->
<div class="panel" id="formulaPanel">
  <div class="panel-header">
    <span class="panel-title">📐 דף נוסחאות — בגרות 5 יח'</span>
    <button class="btn-close" onclick="closePanel('formulaPanel')">✕</button>
  </div>
  <div class="formula-tabs" id="formulaTabs"></div>
  <div class="search-wrap">
    <input class="search-input" id="formulaSearch" placeholder="🔍  חיפוש נוסחה..." oninput="filterFormulas()">
  </div>
  <div class="formula-list" id="formulaList"></div>
</div>

<!-- ══ Quadratic Panel ════════════════════════════════════ -->
<div class="panel" id="quadPanel">
  <div class="panel-header">
    <span class="panel-title">✏️ משוואה ריבועית</span>

// ══ Calculator ════════════════════════════════════════════
let current = '0', stored = null, operator = null, freshNum = true, justCalc = false;

function updateDisplay(expr = '') {
  const md = document.getElementById('mainDisplay');
  md.textContent = current; md.className = 'display-main';
  document.getElementById('exprDisplay').textContent = expr;
}
function inputDigit(d) {
  if (justCalc) { current = d; freshNum = false; justCalc = false; }
  else if (freshNum) { current = d; freshNum = false; }
  else { if (current.length >= 15) return; current = current === '0' ? d : current + d; }
  updateDisplay();
}
function inputDot() {
  if (justCalc || freshNum) { current = '0.'; freshNum = false; justCalc = false; }
  else if (!current.includes('.')) current += '.';
  updateDisplay();
}
function inputOp(op) {
  if (!justCalc && operator && !freshNum) runCalc();
  stored = parseFloat(current); operator = op; freshNum = true; justCalc = false;
  const sym = {'+':'+','-':'−','*':'×','/':'÷','%':'%'};
  updateDisplay(`${stored} ${sym[op]||op}`);
}
function runCalc() {
  if (stored === null || operator === null) return;
  const b = parseFloat(current);
  try {
    let res;
    switch (operator) {
      case '+': res = stored + b; break;
      case '-': res = stored - b; break;
      case '*': res = stored * b; break;
      case '/': if (!b) throw new Error('חלוקה באפס!'); res = stored / b; break;
      case '%': res = stored % b; break;
    }
    if (!isFinite(res)) throw new Error('תוצאה לא חוקית');
    current = parseFloat(res.toPrecision(12)).toString();
  } catch (e) {
    const md = document.getElementById('mainDisplay');
    md.textContent = e.message; md.className = 'display-main error';
    current = '0'; stored = null; operator = null; freshNum = true; return;
  }
}
function calculate() {
  if (!operator) return;
  const sym = {'+':'+','-':'−','*':'×','/':'÷','%':'%'};
  const expr = `${stored} ${sym[operator]||operator} ${current}`;
  runCalc();
  stored = null; operator = null; freshNum = true; justCalc = true;
  updateDisplay(expr + ' =');
}
function clearAll() {
  current = '0'; stored = null; operator = null; freshNum = true; justCalc = false;
  updateDisplay();
}
function delChar() {
  if (justCalc || freshNum) { clearAll(); return; }
  current = current.slice(0,-1) || '0';
  updateDisplay();
}
function toggleSign() {
  if (current !== '0') current = current.startsWith('-') ? current.slice(1) : '-'+current;
  updateDisplay();
}

// ══ Quadratic ═════════════════════════════════════════════
function fmt(n) { return parseFloat(n.toFixed(6)).toString(); }

function solveQuad() {
  const a = +document.getElementById('qa').value;
  const b = +document.getElementById('qb').value;
  const c = +document.getElementById('qc').value;
  if (isNaN(a)||isNaN(b)||isNaN(c)) return showQR('<span class="res-red">הזן מספרים תקינים</span>');
  if (!a) return showQR('<span class="res-red">a לא יכול להיות 0</span>');

  const disc = b*b - 4*a*c;
  const sign = v => v >= 0 ? '+' : '';
  const eq   = `${a}x² ${sign(b)}${b}x ${sign(c)}${c} = 0`;

  let html = `<span class="res-blue">המשוואה: </span>${eq}\n`;
  html    += `<span class="res-blue">Δ = b²-4ac = </span>${fmt(disc)}\n\n`;

  if (disc > 0) {
    const x1 = (-b + Math.sqrt(disc))/(2*a);
    const x2 = (-b - Math.sqrt(disc))/(2*a);
    html += `<span class="res-green">✓  שני פתרונות ממשיים:</span>\n  x₁ = ${fmt(x1)}\n  x₂ = ${fmt(x2)}`;
  } else if (disc === 0) {
    html += `<span class="res-orange">◈  פתרון ממשי אחד (כפול):</span>\n  x = ${fmt(-b/(2*a))}`;
  } else {
    const re = -b/(2*a), im = Math.sqrt(-disc)/(2*a);
    html += `<span class="res-red">✗  פתרונות מרוכבים (Δ < 0):</span>\n  x₁ = ${fmt(re)} + ${fmt(im)}i\n  x₂ = ${fmt(re)} − ${fmt(im)}i`;
  }
  showQR(html);
}
function showQR(html) {
  const el = document.getElementById('quadResult');
  el.innerHTML = html; el.classList.add('show');
}

let mjsReady = false, mjsProm = null, plyReady = false, plyProm = null;

function loadMJS() {
  if (mjsReady) return Promise.resolve();
  if (mjsProm) return mjsProm;
  mjsProm = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/mathjs@13.2.0/lib/browser/math.js';
    s.onload = () => { mjsReady = true; res(); };
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return mjsProm;
}
function loadPly() {
  if (plyReady) return Promise.resolve();
  if (plyProm) return plyProm;
  plyProm = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.plot.ly/plotly-2.35.2.min.js';
    s.onload = () => { plyReady = true; res(); };
    s.onerror = rej;
    document.head.appendChild(s);
  });
  return plyProm;
}

function setSpinner(on) { document.getElementById('funcSpinner').classList.toggle('show', on); }

// helper: format intervals array as string e.g. "(-∞,−2) ∪ (3,+∞)"
function fmtIntervals(intervals) {
  if (!intervals.length) return 'אין';
  return intervals.map(([a,b]) => {
    const L = isFinite(a) ? `(${fmt(a)}` : '(-∞';
    const R = isFinite(b) ? `${fmt(b)})` : '+∞)';
    return `${L}, ${R}`;
  }).join(' ∪ ');
}

async function analyzeFunc() {
  const expr = document.getElementById('funcInput').value.trim();
  if (!expr) return;

  const resEl  = document.getElementById('funcResult');
  const plotEl = document.getElementById('plotDiv');
  resEl.classList.remove('show'); plotEl.classList.remove('show');
  setSpinner(true);

  try { await Promise.all([loadMJS(), loadPly()]); }
  catch {
    setSpinner(false);
    resEl.innerHTML = '<span style="color:#f38ba8">שגיאה בטעינת ספריות — בדוק חיבור לאינטרנט</span>';
    resEl.classList.add('show'); return;
  }

  setSpinner(false);

  try {
    const mjs = window.math;

    // ── symbolic derivatives ──
    let d1str = '?', d2str = '?';
    let d1Node = null, d2Node = null;
    try {
      const fNode = mjs.parse(expr);
      d1Node = mjs.derivative(fNode, 'x');
      d2Node = mjs.derivative(d1Node, 'x');
      d1str = d1Node.toString();
      d2str = d2Node.toString();
    } catch {}

    // ── numeric functions ──
    const compiled  = mjs.compile(expr);
    const d1comp    = d1Node ? mjs.compile(d1Node.toString()) : null;
    const d2comp    = d2Node ? mjs.compile(d2Node.toString()) : null;

    const safeEval = (comp, x) => {
      if (!comp) return NaN;
      try { const v = comp.evaluate({x}); return (typeof v === 'number' && isFinite(v)) ? v : NaN; }
      catch { return NaN; }
    };

    const f   = x => safeEval(compiled, x);
    const df  = x => d1comp ? safeEval(d1comp, x) : (f(x+1e-5) - f(x-1e-5)) / 2e-5;
    const ddf = x => d2comp ? safeEval(d2comp, x) : (f(x+1e-5) - 2*f(x) + f(x-1e-5)) / 1e-10;

    const RANGE = 10, N = 800;
    const xs = Array.from({length: N}, (_, i) => -RANGE + i*(2*RANGE/(N-1)));
    const validXs = xs.filter(x => isFinite(f(x)));

    if (!validXs.length) throw new Error('לא ניתן לחשב את הפונקציה בתחום זה');

    // ── domain detection ──
    // Detect gaps (vertical asymptotes) by large jumps
    const vertAsympt = [];
    for (let i=0; i<xs.length-1; i++) {
      const y1 = f(xs[i]), y2 = f(xs[i+1]);
      if (isNaN(y1) !== isNaN(y2)) {
        const xv = (xs[i]+xs[i+1])/2;
        if (!vertAsympt.some(v => Math.abs(v-xv)<0.3))
          vertAsympt.push(parseFloat(xv.toFixed(3)));
      }
    }

    // ── horizontal asymptotes ──
    const horizAsympt = [];
    const yAtBigPos = f(1e6), yAtBigNeg = f(-1e6);
    if (isFinite(yAtBigPos)) horizAsympt.push({dir:'+∞', val: parseFloat(yAtBigPos.toFixed(4))});
    if (isFinite(yAtBigNeg)) horizAsympt.push({dir:'-∞', val: parseFloat(yAtBigNeg.toFixed(4))});

    // ── x-intercepts (sign change) ──
    const xInter = [];
    for (let i=0; i<validXs.length-1; i++) {
      const y1=f(validXs[i]), y2=f(validXs[i+1]);
      if (y1*y2 < 0) {
        let lo=validXs[i], hi=validXs[i+1];
        for (let k=0;k<50;k++) { const m=(lo+hi)/2; (f(lo)*f(m)<=0)?hi=m:lo=m; }
        const r = parseFloat(((lo+hi)/2).toFixed(4));
        if (!xInter.some(v=>Math.abs(v-r)<0.01)) xInter.push(r);
      }
    }

    // ── y-intercept ──
    let yInt = null;
    try { const v=f(0); if(isFinite(v)) yInt=parseFloat(v.toFixed(4)); } catch {}

    // ── critical points ──
    const critPts = [];
    for (let i=0;i<validXs.length-1;i++) {
      const d1=df(validXs[i]), d2=df(validXs[i+1]);
      if (isFinite(d1)&&isFinite(d2)&&d1*d2<0) {
        let lo=validXs[i], hi=validXs[i+1];
        for (let k=0;k<50;k++) { const m=(lo+hi)/2; (df(lo)*df(m)<=0)?hi=m:lo=m; }
        const cx=parseFloat(((lo+hi)/2).toFixed(4));
        if (!critPts.some(p=>Math.abs(p.x-cx)<0.01)) {
          const cy=parseFloat(f(cx).toFixed(4));
          const dd=ddf(cx);
          const type = dd>0.01?'מינימום מקומי':dd<-0.01?'מקסימום מקומי':'נקודת קיצון';
          critPts.push({x:cx, y:cy, type});
        }
      }
    }

    // ── inflection points ──
    const inflPts = [];
    for (let i=0;i<validXs.length-1;i++) {
      const dd1=ddf(validXs[i]), dd2=ddf(validXs[i+1]);
      if (isFinite(dd1)&&isFinite(dd2)&&dd1*dd2<0) {
        let lo=validXs[i], hi=validXs[i+1];
        for (let k=0;k<50;k++) { const m=(lo+hi)/2; (ddf(lo)*ddf(m)<=0)?hi=m:lo=m; }
        const ix=parseFloat(((lo+hi)/2).toFixed(4));
        if (!inflPts.some(p=>Math.abs(p.x-ix)<0.01)) {
          try { inflPts.push({x:ix, y:parseFloat(f(ix).toFixed(4))}); } catch {}
        }
      }
    }

    // ── monotone intervals ──
    // collect boundary points: edges + critical points + asymptotes
    const bndPts = [-RANGE, ...critPts.map(p=>p.x), ...vertAsympt, RANGE].sort((a,b)=>a-b);
    const increasing = [], decreasing = [];
    for (let i=0;i<bndPts.length-1;i++) {
      const mid = (bndPts[i]+bndPts[i+1])/2;
      const d = df(mid);
      if (!isFinite(d)) continue;
      if (d > 0.001)      increasing.push([bndPts[i],bndPts[i+1]]);
      else if (d < -0.001) decreasing.push([bndPts[i],bndPts[i+1]]);
    }

    // ── concavity intervals ──
    const bndPts2 = [-RANGE, ...inflPts.map(p=>p.x), ...vertAsympt, RANGE].sort((a,b)=>a-b);
    const concaveUp = [], concaveDown = [];
    for (let i=0;i<bndPts2.length-1;i++) {
      const mid = (bndPts2[i]+bndPts2[i+1])/2;
      const dd = ddf(mid);
      if (!isFinite(dd)) continue;
      if (dd > 0.001)      concaveUp.push([bndPts2[i],bndPts2[i+1]]);
      else if (dd < -0.001) concaveDown.push([bndPts2[i],bndPts2[i+1]]);
    }

    // ── Build report ──
    const HR = '─'.repeat(42);
    let R = '';

    R += `f(x) = ${expr}\n${HR}\n\n`;

    R += `[תחום הגדרה]\n`;
    if (!vertAsympt.length) R += `  כל הממשיים  (-∞, +∞)\n`;
    else R += `  למעט: x = ${vertAsympt.join(' , ')}\n`;
    R += '\n';

    R += `[אסימפטוטות]\n`;
    if (vertAsympt.length) R += `  אנכיות:   x = ${vertAsympt.join(' , ')}\n`;
    if (horizAsympt.length) {
      horizAsympt.forEach(h => R += `  אופקית:   y = ${h.val}  (כש x→${h.dir})\n`);
    }
    if (!vertAsympt.length && !horizAsympt.length) R += `  אין אסימפטוטות בתחום\n`;
    R += '\n';

    R += `[חיתוכים]\n`;
    R += `  ציר x:  ${xInter.length ? 'x = '+xInter.join(' , ') : 'לא נמצאו בתחום'}\n`;
    R += `  ציר y:  ${yInt !== null ? 'y = '+yInt : 'לא מוגדרת ב‑x=0'}\n`;
    R += '\n';

    R += `${HR}\n`;
    R += `[נגזרת ראשונה]\n`;
    R += `  f'(x) = ${d1str}\n\n`;
    R += `  f'(x) = 0  ←  נקודות קיצון:\n`;
    if (critPts.length) {
      critPts.forEach(p => R += `    x = ${p.x}   →   f(${p.x}) = ${p.y}  [${p.type}]\n`);
    } else R += `    לא נמצאו בתחום\n`;
    R += '\n';
    R += `  עולה  (f'>0):  ${fmtIntervals(increasing)}\n`;
    R += `  יורדת (f'<0):  ${fmtIntervals(decreasing)}\n`;
    R += '\n';

    R += `${HR}\n`;
    R += `[נגזרת שנייה]\n`;
    R += `  f''(x) = ${d2str}\n\n`;
    R += `  f''(x) = 0  ←  נקודות פיתול:\n`;
    if (inflPts.length) {
      inflPts.forEach(p => R += `    x = ${p.x}   →   f(${p.x}) = ${p.y}\n`);
    } else R += `    לא נמצאו בתחום\n`;
    R += '\n';
    R += `  קעורה  (f''>0):  ${fmtIntervals(concaveUp)}\n`;
    R += `  קמורה (f''<0):  ${fmtIntervals(concaveDown)}\n`;

    resEl.textContent = R;
    resEl.classList.add('show');

    // ── Graph ──
    const ys = validXs.map(x => f(x));
    // split at discontinuities
    const gapXs = [], gapYs = [];
    for (let i=0;i<validXs.length;i++) {
      if (i>0 && Math.abs(ys[i]-ys[i-1])>50) { gapXs.push(null); gapYs.push(null); }
      gapXs.push(validXs[i]); gapYs.push(ys[i]);
    }

    const traces = [{
      x: gapXs, y: gapYs,
      mode:'lines', name:'f(x)',
      line:{color:'#00d4d4', width:2.5},
      connectgaps: false,
    }];
    if (critPts.length) traces.push({
      x: critPts.map(p=>p.x), y: critPts.map(p=>p.y),
      mode:'markers+text', name:'נקודות קיצון',
      marker:{color:'#a6e3a1', size:10, symbol:'circle'},
      text: critPts.map(p=>p.type), textposition:'top center',
      textfont:{color:'#a6e3a1', size:10},
    });
    if (inflPts.length) traces.push({
      x: inflPts.map(p=>p.x), y: inflPts.map(p=>p.y),
      mode:'markers', name:'נקודות פיתול',
      marker:{color:'#fab387', size:9, symbol:'diamond'},
    });
    if (xInter.length) traces.push({
      x: xInter, y: xInter.map(()=>0),
      mode:'markers', name:'חיתוך x',
      marker:{color:'#89b4fa', size:9, symbol:'x'},
    });
    if (vertAsympt.length) {
      vertAsympt.forEach(xv => traces.push({
        x:[xv,xv], y:[-50,50],
        mode:'lines', name:`x=${xv}`,
        line:{color:'rgba(248,113,133,0.4)', dash:'dash', width:1.5},
        showlegend:false,
      }));
    }

    window.Plotly.newPlot(plotEl, traces, {
      paper_bgcolor:'#080d18', plot_bgcolor:'#080d18',
      font:{color:'#e0e0ff', size:11},
      xaxis:{gridcolor:'#1a2540', zerolinecolor:'#2d3f60', color:'#8090b0'},
      yaxis:{gridcolor:'#1a2540', zerolinecolor:'#2d3f60', color:'#8090b0'},
      margin:{l:45, r:16, t:28, b:38},
      legend:{bgcolor:'rgba(0,0,0,0)', font:{color:'#c0d0ff', size:10}},
      showlegend: true,
    }, {responsive:true, displayModeBar:false});

    plotEl.classList.add('show');

  } catch (err) {
    resEl.innerHTML = `<span style="color:#f38ba8">שגיאה: ${err.message}</span>`;
    resEl.classList.add('show');
  }
}

// ══ Service Worker ════════════════════════════════════════
if ('serviceWorker' in navigator)
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
